<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1008"/>
  <!-- Perfume bottle body -->
  <rect x="22" y="28" width="20" height="24" rx="4" ry="4" fill="#b8902a"/>
  <!-- Perfume bottle neck -->
  <rect x="27" y="22" width="10" height="8" rx="2" ry="2" fill="#b8902a"/>
  <!-- Perfume bottle cap -->
  <rect x="25" y="17" width="14" height="7" rx="3" ry="3" fill="#d4a843"/>
  <!-- Shine highlight on bottle -->
  <rect x="25" y="31" width="4" height="12" rx="2" ry="2" fill="#f0c860" opacity="0.5"/>
  <!-- Label line -->
  <rect x="24" y="38" width="16" height="1.5" rx="1" fill="#1a1008" opacity="0.4"/>
  <!-- "A" letter on label -->
  <text x="32" y="48" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#1a1008" text-anchor="middle" opacity="0.7">A</text>
  <!-- Spray mist dots -->
  <circle cx="44" cy="21" r="1.2" fill="#d4a843" opacity="0.8"/>
  <circle cx="47" cy="18" r="0.9" fill="#d4a843" opacity="0.6"/>
  <circle cx="46" cy="24" r="0.8" fill="#d4a843" opacity="0.5"/>
  <circle cx="49" cy="22" r="0.7" fill="#d4a843" opacity="0.4"/>
</svg>
